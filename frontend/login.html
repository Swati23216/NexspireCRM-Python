<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexspire CRM - Sign In</title>

<link rel="stylesheet" href="css/style.css">


</head>

<body>


<div class="login-container">

    <div class="login-box">

        <h1>Nexspire CRM</h1>

        <p class="subtitle" id="authSubtitle">Sign in to your workspace</p>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                id="loginButton"
            >
                Login
            </button>


            <p id="loginMessage"></p>

        </form>

        <form id="registerForm" hidden>
            <div class="form-group">
                <label for="registerName">Full name</label>
                <input id="registerName" name="full_name" autocomplete="name" required>
            </div>
            <div class="form-group">
                <label for="registerEmail">Email</label>
                <input id="registerEmail" type="email" name="email" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="registerMobile">Mobile number</label>
                <input id="registerMobile" type="tel" name="mobile_no" autocomplete="tel" required>
            </div>
            <div class="form-group">
                <label for="registerPassword">Password</label>
                <input id="registerPassword" type="password" name="password" minlength="8" autocomplete="new-password" required>
            </div>
            <button type="submit" id="registerButton">Create account</button>
            <p id="registerMessage" role="status"></p>
        </form>

        <button type="button" class="auth-toggle" id="authToggle">
            New to Nexspire? Create an account
        </button>
        <p class="auth-note">The first account becomes workspace admin. New public registrations receive viewer access.</p>

    </div>

</div>


<!-- API configuration -->
<script src="js/api.js"></script>

<!-- Login logic -->
<script src="js/auth.js"></script>


</body>
</html>
